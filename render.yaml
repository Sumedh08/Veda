services:
  - type: web
    name: veda-api
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: disabled
      - key: ALLOW_PAID_LLM_CALLS
        value: "false"
      - key: RATE_LIMIT_HASH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
  - type: web
    name: veda-web
    runtime: static
    rootDir: frontend
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
